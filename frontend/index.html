<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Board</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Job Board</a>

    <nav class="site-nav" aria-label="Navigation principale">
      <a href="index.html">Offres</a>
      <a href="login.html">Connexion</a>
      <a href="register.html">Inscription</a>
    </nav>
  </header>

  <main class="page">
    <section class="intro">
      <p class="eyebrow">Opportunités tech</p>
      <h1>Trouve une offre et postule simplement</h1>
    </section>

    <section class="toolbar" aria-label="Filtres">
      <label for="search">Rechercher sur cette page</label>
      <input id="search" type="search" placeholder="Titre, entreprise, ville...">
    </section>

    <section aria-label="Offres disponibles">
      <p id="offers-message" role="status"></p>
      <button id="retry-offers" type="button" hidden>Réessayer</button>
      <div id="offers-list" class="offers-grid"></div>
      <div class="pagination" role="group" aria-label="Pages des offres">
        <button id="previous-page" type="button" disabled>Précédent</button>
        <span id="page-status" role="status"></span>
        <button id="next-page" type="button" disabled>Suivant</button>
      </div>
    </section>

    <section id="offer-detail" class="panel" aria-labelledby="detail-title" hidden>
      <h2 id="detail-title" tabindex="-1"></h2>
      <p id="detail-company"></p>
      <p id="detail-location"></p>
      <p id="detail-description"></p>
      <button id="close-detail" type="button" class="secondary">Fermer les détails</button>
    </section>

    <section id="apply-panel" class="panel" aria-labelledby="apply-title" hidden>
      <h2 id="apply-title">Postuler</h2>
      <p id="apply-offer"></p>
      <form id="apply-form">
        <fieldset id="apply-fields" aria-label="Candidature">
        <input type="hidden" name="offre_id">
        <div class="form-grid">
          <label>
            Prénom
            <input name="prenom" autocomplete="given-name" required>
          </label>

          <label>
            Nom
            <input name="nom" autocomplete="family-name" required>
          </label>

          <label>
            Email
            <input name="email" type="email" autocomplete="email" required>
          </label>

          <label>
            Téléphone (facultatif)
            <input name="telephone" type="tel" autocomplete="tel">
          </label>
        </div>

        <label>
          Message
          <textarea name="message" required></textarea>
        </label>

        <button type="submit">Envoyer ma candidature</button>
        <button id="close-apply" type="button" class="secondary">Fermer</button>
        </fieldset>
      </form>

      <p id="apply-message" class="feedback" role="status"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
