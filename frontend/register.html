<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription - Job Board</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Job Board</a>
    <nav class="site-nav" aria-label="Navigation principale">
      <a href="index.html">Offres</a>
      <a href="login.html">Connexion</a>
    </nav>
  </header>

  <!-- Une seule page pour créer ET modifier un compte : register.js choisit le mode selon la session -->
  <main class="page">
    <section class="panel">
      <h1 id="account-title">Inscription</h1>
      <p id="account-notice" class="notice">Crée un compte candidat pour utiliser le Job Board.</p>
      <p id="register-message" class="feedback" role="status"></p>

      <form id="register-form">
        <div class="form-grid">
          <label>
            Prénom
            <input name="prenom" autocomplete="given-name" required>
          </label>

          <label>
            Nom
            <input name="nom" autocomplete="family-name" required>
          </label>

          <label>
            Email
            <input name="email" type="email" autocomplete="email" required>
          </label>

          <!-- Caché à l'inscription : la route /inscription n'enregistre pas le téléphone -->
          <label id="telephone-field" hidden>
            Téléphone (facultatif)
            <input name="telephone" type="tel" autocomplete="tel">
          </label>

          <label>
            <span id="password-label">Mot de passe</span>
            <input name="password" type="password" autocomplete="new-password" minlength="8" required>
          </label>

          <label>
            Confirmer le mot de passe
            <input name="confirmPassword" type="password" autocomplete="new-password" required>
          </label>
        </div>

        <button type="submit">S'inscrire</button>
      </form>
    </section>
  </main>

  <script src="session.js"></script>
  <script src="register.js"></script>
</body>
</html>
